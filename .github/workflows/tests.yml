name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: python -m pip install --upgrade pip .[dev]

      - name: Run unit tests
        run: python -m pytest -m "not integration" -v

  package:
    name: Build and smoke-test migration distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build and check both distributions
        run: |
          python -m build --outdir dist/bcbdata
          python -m build compat/bcbpy --outdir dist/bcbpy
          python -m twine check --strict dist/bcbdata/* dist/bcbpy/*
      - name: Import both wheels outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/bcbdata-wheels"
          "$RUNNER_TEMP/bcbdata-wheels/bin/python" -m pip install dist/bcbdata/*.whl dist/bcbpy/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bcbdata-wheels/bin/python" -c "from importlib.metadata import version; import bcbdata, bcbpy; assert version('bcbdata') == version('bcbpy') == bcbdata.__version__; assert all(getattr(bcbpy, name) is getattr(bcbdata, name) for name in bcbdata.__all__); import bcbpy.client, bcbdata.client; assert bcbpy.client is bcbdata.client"
